<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách người dùng</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    text-align: center;
}

.container {
    width: 80%;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

table {
    width: 100%;
    border-collapse: collapse;
    margin: 20px 0;
}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: center;
}

th {
    background-color: #007BFF;
    color: white;
}

.pagination {
    margin: 20px 0;
}

button {
    padding: 8px 12px;
    background-color: #007BFF;
    color: white;
    border: none;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    background-color: darkblue;
}

a {
    text-decoration: none;
    color: #007BFF;
    margin: 0 5px;
}

    </style>
    <link rel="stylesheet" href="css/style_list.css">
</head>
<body>
    <div class="container">
        <header>
            <h2>Lập trình web</h2>
            <nav>
                <a href="index.html">Home</a> | 
                <a href="login.html">Đăng xuất</a>
            </nav>
        </header>

        <h3>Danh sách user</h3>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="userTable">
                <!-- Dữ liệu sẽ được thêm bằng JavaScript -->
            </tbody>
        </table>

        <div class="pagination">
            <button id="prevPage">Previous</button>
            <span id="pageNumbers"></span>
            <button id="nextPage">Next</button>
        </div>

        <footer>
            <p>Lập trình web ©01/2024</p>
        </footer>
    </div>

    <script src="js/js_list.js"></script>
</body>
</html>

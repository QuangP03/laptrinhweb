<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập nhật thông tin</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.login-container {
    background: white;
    padding: 20px;
    width: 350px;
    text-align: center;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    border-radius: 8px;
}

h2 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    width: 100%;
    padding: 10px;
    background-color: blue;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: darkblue;
}

.error-message {
    color: red;
    font-size: 14px;
    margin-top: 10px;
}

    </style>
</head>
<body>
    <div class="login-container">
        <h2>Màn hình cập nhật</h2>
        <form id="updateForm">
            <label for="username">Username</label>
            <input type="text" id="username" value="xxx" required>

            <label for="password">Mật khẩu</label>
            <input type="password" id="password" value="xxx" required>

            <label for="confirmPassword">Nhập lại mật khẩu</label>
            <input type="password" id="confirmPassword" value="xxx" required>

            <label for="email">Email</label>
            <input type="email" id="email" value="xxx@example.com" required>

            <p class="error-message" id="errorMessage"></p>

            <button type="submit">Cập nhật</button>
        </form>
        <a href="index.html">Đã có tài khoản? Đăng nhập</a>
    </div>

    <script src="js/js.js"></script>
</body>
</html>
